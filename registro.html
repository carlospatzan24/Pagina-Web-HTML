<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de registro de usuario</title>
</head>

<body>
    <header>
        <h1>Registro de Usuario</h1>
    </header>

    <main>
        <section>
            <h2>Ingrese sus datos:</h2>

            <form>
                <label for="nombres">Nombre(s):</label>
                <input type="text" id="nombres" name="nombres" required>
                <br><br>

                <label for="apellidos">Apellido(s):</label>
                <input type="text" id="apellidos" name="apellidos" required>
                <br><br>

                <label for="pais">País:</label>
                <input type="text" id="pais" name="pais" required>
                <br><br>

                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion" required>
                <br><br>
    
                <label for="genero">Género:</label>
                <select id="genero" name="genero" required>
                    <option value="">Seleccione su género</option>
                    <option value="hombre">Hombre</option>
                    <option value="mujer">Mujer</option>
                </select>
                <br><br>
    
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                <br><br>
                
                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" name="contraseña" required>
                <br><br>
    
                <label for="comentarios">Comentarios:</label><br>
                <textarea id="comentarios" name="comentarios" rows="5" cols="60" placeholder="Escriba sus comentarios o datos adicionales aquí."></textarea>
                <br><br>
                
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tiene una cuenta? <a href="sesion.html">Inicie sesión aquí</a></p>
        </section>

    </main>

    <footer>
        <p><strong>Página de registro de usuario HTML 2025 UPANA</strong></p>
    </footer>

</body>
</html>
